name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Lint
        run: |
          pip install ruff
          ruff check apps config tests
      - run: python manage.py test tests --settings=config.settings_test

  backend-postgres:
    # SQLite hides case-sensitivity, transaction and constraint differences.
    # Production is PostgreSQL, so the suite has to pass there too.
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cbc_test
          POSTGRES_USER: cbc
          POSTGRES_PASSWORD: cbc
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: cbc_test
      POSTGRES_USER: cbc
      POSTGRES_PASSWORD: cbc
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt psycopg[binary]
      - run: python manage.py migrate
      - run: python manage.py test tests --settings=config.settings_ci

  deploy-checks:
    # `manage.py check --deploy` only reports anything with DEBUG off, which is
    # exactly the configuration nobody exercises locally.
    name: Production settings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "false"
      SECRET_KEY: kX7q2Vb9Lm4Rt8Zc1Nf6Ay3Ws5Ej0Ph2Gd4Uv7Bn9Ko1Ix3Qz6Tl8Cr5Mw
      ALLOWED_HOSTS: example.test
      CORS_ALLOWED_ORIGINS: https://example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy --fail-level WARNING
      - name: Refuse to start without a real SECRET_KEY
        env:
          SECRET_KEY: ""
        run: |
          if python manage.py check 2>/dev/null; then
            echo "Expected startup to fail with DEBUG off and no SECRET_KEY"
            exit 1
          fi
          echo "Correctly refused to start."

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
