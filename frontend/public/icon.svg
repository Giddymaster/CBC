<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ShuleNest">
  <defs>
    <linearGradient id="nest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa733"/>
      <stop offset="1" stop-color="#f4791f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
  </defs>

  <!-- Graduation cap -->
  <g>
    <polygon points="32,7 52,15 32,23 12,15" fill="#1a35a0"/>
    <polygon points="32,23 45,17.8 45,26 32,30 19,26 19,17.8" fill="#24429c"/>
    <line x1="52" y1="15" x2="52" y2="27" stroke="#f6a01e" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="52" cy="28" r="2.2" fill="#f6a01e"/>
  </g>

  <!-- Nest bowl -->
  <path d="M4 33 C4 33 12 41 32 41 C52 41 60 33 60 33
           C60 47 48 58 32 58 C16 58 4 47 4 33 Z" fill="url(#nest)"/>
  <!-- Woven strands -->
  <g fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M8 37 C20 46 44 46 56 37" stroke="#1a35a0" stroke-width="2"/>
    <path d="M10 44 C22 52 42 52 54 44" stroke="#c85a12" stroke-width="2"/>
    <path d="M15 51 C22 55 42 55 49 51" stroke="#1a35a0" stroke-width="1.8"/>
  </g>

  <!-- Open book resting in the nest -->
  <g>
    <path d="M32 30 C27 26 20 26 15 28 L15 40 C20 38 27 38 32 42 Z" fill="url(#page)" stroke="#1a35a0" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M32 30 C37 26 44 26 49 28 L49 40 C44 38 37 38 32 42 Z" fill="url(#page)" stroke="#1a35a0" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="32" y1="30" x2="32" y2="42" stroke="#1a35a0" stroke-width="1.4"/>
  </g>
</svg>
