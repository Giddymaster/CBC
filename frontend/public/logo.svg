<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" role="img" aria-label="ShuleNest — Learn, Grow, Achieve">
  <defs>
    <linearGradient id="lnest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa733"/>
      <stop offset="1" stop-color="#f4791f"/>
    </linearGradient>
    <linearGradient id="lpage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
  </defs>

  <!-- Nest mark (the favicon art, scaled) -->
  <g transform="translate(8,20) scale(2.45)">
    <polygon points="32,7 52,15 32,23 12,15" fill="#1a35a0"/>
    <polygon points="32,23 45,17.8 45,26 32,30 19,26 19,17.8" fill="#24429c"/>
    <line x1="52" y1="15" x2="52" y2="27" stroke="#f6a01e" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="52" cy="28" r="2.2" fill="#f6a01e"/>
    <path d="M4 33 C4 33 12 41 32 41 C52 41 60 33 60 33 C60 47 48 58 32 58 C16 58 4 47 4 33 Z" fill="url(#lnest)"/>
    <g fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M8 37 C20 46 44 46 56 37" stroke="#1a35a0" stroke-width="2"/>
      <path d="M10 44 C22 52 42 52 54 44" stroke="#c85a12" stroke-width="2"/>
      <path d="M15 51 C22 55 42 55 49 51" stroke="#1a35a0" stroke-width="1.8"/>
    </g>
    <path d="M32 30 C27 26 20 26 15 28 L15 40 C20 38 27 38 32 42 Z" fill="url(#lpage)" stroke="#1a35a0" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M32 30 C37 26 44 26 49 28 L49 40 C44 38 37 38 32 42 Z" fill="url(#lpage)" stroke="#1a35a0" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="32" y1="30" x2="32" y2="42" stroke="#1a35a0" stroke-width="1.4"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-weight="900" letter-spacing="1">
    <text x="205" y="88" font-size="76" fill="#1a3a8f">SHULE</text>
    <text x="205" y="162" font-size="76">
      <tspan fill="#e53935">N</tspan><tspan fill="#fb8c00">E</tspan><tspan fill="#43a047">S</tspan><tspan fill="#8e24aa">T</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="2">
    <line x1="210" y1="185" x2="228" y2="185" stroke="#1a3a8f" stroke-width="2"/>
    <text x="236" y="191" fill="#1a3a8f">LEARN</text>
    <text x="312" y="191" fill="#7a8699">·</text>
    <text x="326" y="191" fill="#fb8c00">GROW</text>
    <text x="398" y="191" fill="#7a8699">·</text>
    <text x="412" y="191" fill="#43a047">ACHIEVE</text>
    <line x1="512" y1="185" x2="530" y2="185" stroke="#43a047" stroke-width="2"/>
  </g>
</svg>
