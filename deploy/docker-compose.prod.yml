# Production stack for a single server. Everything the app needs, in one file.
#
#   cp deploy/.env.prod.example deploy/.env.prod   # then edit
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod run --rm web python manage.py migrate
#
# See DEPLOY.md for the full runbook.

name: cbc

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ../backend
    restart: unless-stopped
    environment: &backend_env
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      # Optional real integrations — leave blank for stub mode.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY:-}
      DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET:-}
      DARAJA_SHORTCODE: ${DARAJA_SHORTCODE:-174379}
      DARAJA_PASSKEY: ${DARAJA_PASSKEY:-}
      DARAJA_BASE_URL: ${DARAJA_BASE_URL:-https://sandbox.safaricom.co.ke}
      DARAJA_CALLBACK_URL: ${DARAJA_CALLBACK_URL:-}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ../backend
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    environment: *backend_env
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media:/srv/media:ro       # serve learner photos + report cards read-only
      - caddy_data:/data          # TLS certificates persist across restarts
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
